name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker.yml"
      - "cli/**"
      - "hub/**"
      - "shared/**"
      - "web/**"
      - ".dockerignore"
      - "Dockerfile"
      - "bun.lock"
      - "docker/**"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/docker.yml"
      - "cli/**"
      - "hub/**"
      - "shared/**"
      - "web/**"
      - ".dockerignore"
      - "Dockerfile"
      - "bun.lock"
      - "docker/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        target:
          - hub
          - runner

    steps:
      - name: Check out repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" \
              fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/merge"
          else
            git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" \
              fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --force FETCH_HEAD

      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Set up Docker Buildx
        run: |
          set -euo pipefail
          docker buildx create --name hapi-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Docker metadata
        id: meta
        env:
          TARGET: ${{ matrix.target }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          sanitize_tag() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//'
          }

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/hapi-${TARGET}"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"

          tags=()
          case "${GITHUB_REF}" in
            refs/heads/*)
              tags+=("${image}:$(sanitize_tag "${GITHUB_REF_NAME}")")
              ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              tags+=("${image}:$(sanitize_tag "${GITHUB_REF_NAME}")")
              tags+=("${image}:$(sanitize_tag "${version}")")
              case "${version}" in
                *.*.*)
                  tags+=("${image}:$(sanitize_tag "$(printf '%s' "${version}" | cut -d. -f1,2)")")
                  ;;
              esac
              ;;
            refs/tags/*)
              tags+=("${image}:$(sanitize_tag "${GITHUB_REF_NAME}")")
              ;;
            refs/pull/*)
              tags+=("${image}:pr-${PR_NUMBER}")
              ;;
          esac

          tags+=("${image}:sha-${short_sha}")
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags+=("${image}:latest")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail

          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && args+=(--tag "${tag}")
          done <<< "${TAGS}"
          while IFS= read -r label; do
            [ -n "${label}" ] && args+=(--label "${label}")
          done <<< "${LABELS}"

          output=(--push)
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            output=(--output=type=cacheonly)
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --target "${TARGET}" \
            --cache-from type=gha,scope=hapi \
            --cache-to type=gha,mode=max,scope=hapi \
            "${args[@]}" \
            "${output[@]}" \
            .
